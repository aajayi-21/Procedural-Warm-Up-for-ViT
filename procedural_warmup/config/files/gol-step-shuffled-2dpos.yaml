# CONTROL for gol-step-true-2dpos. Same 2-D board + sincos2d, but the target is life_step(z)
# for an unrelated board z at the same density. true minus shuffled is the operator-learning
# signal: it must exceed zero for a next-state win to mean "the 2-D operator transferred"
# rather than "a generic 2-D locality prior was installed" (the conv-shortcut confound).
seed: 42
run_name: gol-step-shuffled-2dpos
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }
vocab: { K: 4, PAD_ID: 0, MASK_ID: 1 }

data:
  source: gol_step

ca_step:                                       # GolStepDataset reuses ca_step.{densities,mode}
  boundary: periodic
  densities: [0.2, 0.3, 0.4, 0.5]
  mode: "shuffled"                             # target = life_step(z), z independent at same density

masking: { mode: random, mask_ratio: 0.5 }     # ignored by TransductionMasking (full mask)

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
