# Procedural warm-up on ECA Rule 110 (Class IV, Turing-complete) — Stage-1 primary config.
# Matches the paper's ViT-T/16 warm-up recipe (15k steps, mask 0.5, AdamW lr 2e-3).
seed: 42
run_name: ca-rule110
results_dir: results

model:
  name: vit_tiny_patch16_224
  embed_dim: 192

grid: { H: 14, W: 14 }          # N = 196 tokens

vocab:                           # binary tokenization uses ids {PAD=0, MASK=1, state0=2, state1=3}
  K: 4
  PAD_ID: 0
  MASK_ID: 1

data:
  source: ca

ca:
  rule: 110
  dim: 1
  sim_width: 64                  # simulate wider than the 14-col window for real light cones
  burn_in: 32
  boundary: periodic
  init_density: 0.5
  tokenize: { mode: binary, block_size: 7 }

masking:
  mode: random                   # random | forward | lightcone
  mask_ratio: 0.5

dataset: { n_samples: 100000, batch_size: 256, num_workers: 4, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50 }
