# NEXT-STATE + adjacency exposed (H3 on the operator objective). Identical to ca-iid1step-true
# (predict the full Rule-110 next state from the current i.i.d. board) EXCEPT the frozen
# positional embedding is the 1-D RING sin/cos, which exposes the board's true periodic
# adjacency. The 196-cell board is a 1-D ring, so sincos2d would be wrong (it fragments the
# ring every 14 cells); sincos1d is the correct code. Tests whether the prior next-state
# failure (66.8, true ~= shuffled) was the random positional code hiding ring adjacency.
seed: 42
run_name: ca-iid1step-true-1dpos
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos1d }
grid: { H: 14, W: 14 }                        # 196-cell 1-D ring board
vocab: { K: 4, PAD_ID: 0, MASK_ID: 1 }

data:
  source: ca_step

ca_step:
  rule: 110
  boundary: periodic
  densities: [0.15, 0.25, 0.35, 0.45, 0.55, 0.65]
  mode: "true"

masking: { mode: random, mask_ratio: 0.5 }    # ignored by TransductionMasking (full mask)

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
