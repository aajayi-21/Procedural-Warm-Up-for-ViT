# H3 TEST — the minimal "don't flatten away the 2-D structure" fix.
# Identical to ca-rule110 (binary K=4, i.i.d. random masking) EXCEPT the frozen positional
# embedding is 2-D sin/cos, which exposes the (time, space) grid adjacency the random 1-D
# code hid. Pure single-factor test of failure Hypothesis 3 vs the ca-rule110 baseline.
seed: 42
run_name: ca-rule110-2dpos
results_dir: results

model:
  name: vit_tiny_patch16_224
  embed_dim: 192
  pos_embed: sincos2d            # <-- the only change vs ca-rule110

grid: { H: 14, W: 14 }           # N = 196; sincos2d maps p -> (p//W, p%W) = (time, space)
vocab: { K: 4, PAD_ID: 0, MASK_ID: 1 }

data:
  source: ca

ca:
  rule: 110
  dim: 1
  sim_width: 64
  burn_in: 32
  boundary: periodic
  init_density: 0.5
  tokenize: { mode: binary, block_size: 7 }

masking: { mode: random, mask_ratio: 0.5 }

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
