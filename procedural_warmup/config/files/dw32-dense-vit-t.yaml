# H6 optional supervision-density arm (RUN_DENSE=1 in run_dw2d_experiments.sh):
# identical to dw32-vit-t except mask_ratio 1.0 — every eligible d-corner is masked,
# ~34.5 targets/sample (17.6% of tokens) vs ~17.3 (8.8%) at ratio 0.5. Context: 1D
# close-only masks ~49 targets/sample (25%), so the standard DW arm carries a ~2.8x
# per-step supervised-target deficit (measured; reported by data.dyck2d.stats). This
# arm separates "partial H6 result because 2D presentation costs" from "partial
# because less supervision per step" before that distinction gets written into a verdict.
seed: 42
run_name: dw32-dense-vit-t
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }
vocab: { K: 130, PAD_ID: 0, MASK_ID: 1 }   # 2 specials + 4k corner symbols (k=32)

data:
  source: dyck2d

dyck2d: { k: 32, p_acc: 0.6, open_prob: 0.6, min_match_distance: 2 }

masking: { mode: corner_close_only, mask_ratio: 1.0 }  # all eligible d-corners

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint:
  out_dir: checkpoints
  save_steps: [15000]
  probe_steps: [0, 250, 500, 1000, 2000, 4000, 6000, 8000, 10000, 12500, 15000]
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50 }
