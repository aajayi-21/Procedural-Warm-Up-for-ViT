# CPU smoke config for the dyck2d pipeline: 50 tiny steps end-to-end (warm-up ->
# checkpoints + probe snapshots -> strip), then `analysis.weight_probe --run dw32-smoke
# --device cpu`. Validates the full probe pipeline before any GPU time (plan §verify).
seed: 42
run_name: dw32-smoke
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }
vocab: { K: 130, PAD_ID: 0, MASK_ID: 1 }

data:
  source: dyck2d

dyck2d: { k: 32, p_acc: 0.6, open_prob: 0.6, min_match_distance: 2 }

masking: { mode: corner_close_only, mask_ratio: 0.5 }

dataset: { n_samples: 512, batch_size: 8, num_workers: 0, pin_memory: false }
training: { steps: 50, device: cpu, use_amp: false }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 10, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [50], probe_steps: [0, 25, 50] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 5, figure_every: 25 }
