# Procedural warm-up on 2-D Conway's Game of Life (B3/S23) via next-state prediction.
#
# STATUS: Stage-4 research scaffold — NOT yet verified effective. Across CPU learning-curve
# probes this task (and every variant tried) did not learn within the budget where the 1-D
# ECA-block and k-Dyck sources clearly do; the 2-D cross-frame dependency appears hard for
# the 1-D-token/random-positional ViT to crack quickly. Provided so it can be validated on
# the full GPU run or redesigned. The verified-effective source is ca-rule110-block.yaml.
#
# Layout: 14x14 token grid = two stacked 7x14 block-token frames (state t on top, t+1 below);
# forward masking hides the bottom frame so the model predicts t+1 from t (applies the rule).
seed: 42
run_name: gol
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192 }
grid: { H: 14, W: 14 }                 # two stacked 7x(14*7=98)-cell frames -> 14x14 block tokens
vocab: { K: 130, PAD_ID: 0, MASK_ID: 1 }   # 2 specials + 2^7 block symbols

data:
  source: gol

ca:
  dim: 2
  burn_in: 0                           # t = random config (max diversity); evolve to t+1
  init_density: 0.38
  gol_steps: 1                         # predict one Life step ahead
  tokenize: { mode: block, block_size: 7 }   # block tokens keep the target non-trivial

# forward masking hides the bottom frame (= state t+1); forward_rows MUST equal grid.H//2.
masking: { mode: forward, mask_ratio: 0.5, forward_rows: 7 }

dataset: { n_samples: 100000, batch_size: 256, num_workers: 4, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
