# GENUINELY-2-D next-state operator: predict the entire next Game-of-Life state from the
# current i.i.d. 2-D board. The Moore-8 neighborhood is 2-D-local, so sincos2d exposes the grid
# adjacency the operator needs — a test of "does an entire-next-state objective transfer when
# the operator is genuinely 2-D AND its geometry is exposed?" (failure Hyp. 3). Caveat: the
# board is toroidal but sincos2d is non-periodic, so the ~27% border cells' wrap neighbours are
# not exposed as adjacent (conservative — risks a false negative, cancels in true-shuffled).
seed: 42
run_name: gol-step-true-2dpos
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }                         # 14x14 2-D board (matches the ViT patch grid)
vocab: { K: 4, PAD_ID: 0, MASK_ID: 1 }

data:
  source: gol_step

ca_step:                                       # GolStepDataset reuses ca_step.{densities,mode}
  boundary: periodic
  densities: [0.2, 0.3, 0.4, 0.5]              # i.i.d. input board density buckets (Life is sparse)
  mode: "true"                                 # target = life_step(x)

masking: { mode: random, mask_ratio: 0.5 }     # ignored by TransductionMasking (full mask)

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
