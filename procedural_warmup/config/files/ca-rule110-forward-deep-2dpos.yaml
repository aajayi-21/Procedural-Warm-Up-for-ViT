# DEEP next-state + 2-D positions (the "top pick" H3 run). forward_rows=12 masks all but the
# first 2 time rows: predicting the deepest masked row requires iterating the rule ~12 steps —
# the regime where a wide fixed lookup stops being cheaper than genuine composition.
# IMPORTANT: sim_width=14 (= cell_W, no crop) with boundary=zero makes the 14x14 grid a
# SELF-CONTAINED deterministic trajectory, so every masked future cell is determined by the 2
# visible rows (the forward target is 100% well-posed; with the default sim_width=64 crop only
# ~25% would be). Zero boundary keeps both axes non-periodic, so sincos2d is exactly correct.
seed: 42
run_name: ca-rule110-forward-deep-2dpos
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }
vocab: { K: 4, PAD_ID: 0, MASK_ID: 1 }

data:
  source: ca

ca:
  rule: 110
  dim: 1
  sim_width: 14                  # = cell_W: no crop => self-contained, well-posed forward target
  burn_in: 32
  boundary: zero                 # non-periodic both axes => sincos2d is exactly correct
  init_density: 0.5
  tokenize: { mode: binary, block_size: 7 }

masking: { mode: forward, mask_ratio: 0.5, forward_rows: 12 }   # predict 12 future rows from 2

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
