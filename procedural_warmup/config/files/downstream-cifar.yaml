# Downstream image-classification transfer (CIFAR-100 by default).
# Set init_checkpoint to a stripped warm-up checkpoint, or leave null for random init.
seed: 42
run_name: cifar100-rule110
results_dir: results
init_checkpoint: null            # e.g. checkpoints/ca-rule110/ckpt_step_015000_stripped.pt

model: { name: vit_tiny_patch16_224, drop_path_rate: 0.1 }

data:
  dataset: CIFAR100              # CIFAR10 | CIFAR100
  data_root: data
  input_size: 224               # model input: 14x14 patch grid == warm-up token geometry
  cpu_size: 32                  # CPU augments at 32px; GPU upscales to 224 (avoids starvation)
  num_workers: 0                # 0 = auto (CPU cores capped at 16)

aug:
  color_jitter: 0.3
  auto_augment: rand-m9-mstd0.5-inc1
  reprob: 0.25
  mixup: 0.8
  cutmix: 1.0
  smoothing: 0.1

train:
  epochs: 300
  warmup_epochs: 50
  batch_size: 512
  lr: 0.002
  weight_decay: 0.05
  min_lr: 1.0e-5
  warmup_lr: 1.0e-6
  clip_grad: 1.0
  use_amp: true
  device: cuda

logging: { print_freq: 50 }
wandb: { enabled: false, project: procedural-warmup-ca }
