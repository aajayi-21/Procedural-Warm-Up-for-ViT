# ALL LEVERS + 2-D positions (ceiling run): block tokenization (K=130) + forward next-state
# masking + sincos2d. Equals ca-rule110-hard + sincos2d. Upper bound for "stack every
# modification AND retain 2-D structure"; compare to ca-rule110-hard (same minus 2-D) to see
# the marginal value of the 2-D positional code on top of the best 1-D recipe.
seed: 42
run_name: ca-rule110-hard-2dpos
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }
vocab: { K: 130, PAD_ID: 0, MASK_ID: 1 }

data:
  source: ca

ca:
  rule: 110
  dim: 1
  sim_width: 128
  burn_in: 32
  boundary: periodic
  init_density: 0.5
  tokenize: { mode: block, block_size: 7 }

masking: { mode: forward, mask_ratio: 0.5, forward_rows: 7 }

dataset: { n_samples: 100000, batch_size: 256, num_workers: 4, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
