# Spatial-Dyck NESTED — same latent k-Dyck tree as the baseline, laid along a Hilbert curve
# so subtrees occupy compact 2-D regions (open/close at region ends, children nested inside).
# IDENTICAL to dyck-vit-t.yaml except data.source + spatial_dyck.mode. Candidate for beating
# the 1-D grammar via spatialized hierarchy.
seed: 42
run_name: spatial-dyck-nested
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos2d }
grid: { H: 14, W: 14 }
vocab: { K: 130, PAD_ID: 0, MASK_ID: 1 }

data:
  source: spatial_dyck

dyck: { k_open: 64, k_close: 64, open_prob: 0.6, min_pairs: 1 }   # shared generator params
spatial_dyck: { mode: nested }

masking: { mode: random, mask_ratio: 0.5 }   # close-only masking (unchanged)

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
