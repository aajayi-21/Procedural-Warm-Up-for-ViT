# CONTROL for ca-iid1step-true-1dpos. Same 1-D ring positional code, but the target is
# Rule110(z) for an unrelated board z at the same density (no causal link to the input). The
# true-minus-shuffled gap is the operator-learning signal; it MUST exceed zero for any
# next-state win to count as "the operator transferred" rather than a generic locality prior.
seed: 42
run_name: ca-iid1step-shuffled-1dpos
results_dir: results

model: { name: vit_tiny_patch16_224, embed_dim: 192, pos_embed: sincos1d }
grid: { H: 14, W: 14 }
vocab: { K: 4, PAD_ID: 0, MASK_ID: 1 }

data:
  source: ca_step

ca_step:
  rule: 110
  boundary: periodic
  densities: [0.15, 0.25, 0.35, 0.45, 0.55, 0.65]
  mode: "shuffled"                             # target = Rule110(z), z independent at same density

masking: { mode: random, mask_ratio: 0.5 }    # ignored by TransductionMasking (full mask)

dataset: { n_samples: 100000, batch_size: 256, num_workers: 16, pin_memory: true }
training: { steps: 15000, device: cuda }
optimizer: { lr: 0.002, weight_decay: 0.05, betas: [0.9, 0.999] }
scheduler: { enabled: true, warmup_steps: 1000, warmup_start_lr: 1.0e-6, min_lr: 1.0e-5 }
checkpoint: { out_dir: checkpoints, save_steps: [15000] }
wandb: { enabled: false, project: procedural-warmup-ca }
logging: { print_freq: 50, progress: true, figure_every: 1000 }
